# Route ajoutée aux requêtes hors dialogue destinées au domaine de FusionPBX : elles sont envoyées à 100.100.102.90.
# À copier dans /etc/flexisip/routes.conf.
# Syntaxe : <route SIP>   <condition>
# À VÉRIFIER : le port et le transport du profil SIP de FusionPBX (5060 en UDP supposé, profil « internal »).
# Ajouter une condition par domaine FusionPBX utilisé par les mobiles.
<sip:100.100.102.90:5060;transport=udp;lr>   is_request && request.uri.domain == 'testdomaine.gama-it.fr'
