# Flexisip 2.6.2 en passerelle de push devant FusionPBX (100.100.102.90). Seules les valeurs qui changent des
# valeurs par défaut sont indiquées. À copier dans /etc/flexisip/flexisip.conf (sauvegarder l'ancien avant).
#
# Principe : le mobile s'enregistre via ce serveur (proxy sortant). Flexisip relaie le REGISTER à FusionPBX, qui reste
# le seul registrar. Pour un appel, FusionPBX envoie l'INVITE ici, et Flexisip envoie le push puis relaie l'appel.
# Les PC continuent de s'enregistrer directement sur FusionPBX.

[global]
# Noms par lesquels les clients joignent ce serveur.
aliases=push.gama-it.fr 154.41.128.151 100.100.102.91 localhost
# Transport public en premier (mobiles, TLS) : l'adresse annoncée est l'IP publique, l'écoute se fait sur l'IP interne
# (maddr), car la VM n'a que 100.100.102.91 (l'IP publique est une redirection). Puis le transport privé pour
# FusionPBX ; « network » (2.6+) dit à Flexisip de l'utiliser pour joindre ce réseau.
# À VÉRIFIER au démarrage : l'écoute sur 5061 et sur 5080 (ss -lntup | grep flexisip).
transports=sips:154.41.128.151:5061;maddr=100.100.102.91 sip:100.100.102.91:5080;transport=udp;network=100.100.102.0/24
# Certificat Let's Encrypt de push.gama-it.fr, copié dans /etc/flexisip/tls/ par le script de renouvellement
# (deploy-hook certbot), car Flexisip ne lit pas /etc/letsencrypt.
tls-certificates-file=/etc/flexisip/tls/fullchain.pem
tls-certificates-private-key=/etc/flexisip/tls/privkey.pem
tls-certificates-ca-file=/etc/ssl/certs/ca-certificates.crt

# Serveur STUN intégré : inutile ici, on évite de l'exposer.
[stun-server]
enabled=false

[module::Forward]
routes-config-path=/etc/flexisip/routes.conf

# FusionPBX peut envoyer beaucoup de trafic : il ne doit jamais être banni.
[module::DoSProtection]
white-list=100.100.102.90

# Pas d'authentification ici : elle est faite par FusionPBX.
[module::Authentication]
enabled=false

# Le média passe directement entre les clients et FreeSWITCH.
[module::MediaRelay]
enabled=false

[module::Transcoder]
enabled=false

[module::Registrar]
reg-domains=*
# N'enregistre le contact que lorsque FusionPBX a répondu 200 OK.
reg-on-response=true

[module::Router]
# Ne route que les requêtes venant de FusionPBX (paramètre doroute) et les réponses.
filter=(is_request && request.uri.params contains 'doroute') || is_response
# Attend le nouvel enregistrement du mobile réveillé avant de relayer l'appel.
fork-late=true

[module::PushNotification]
enabled=true
# Firebase : à renseigner à l'étape Firebase.

# Module absent du fichier par défaut, à déclarer ici.
[module::ContactRouteInserter]
insert-domain=true
